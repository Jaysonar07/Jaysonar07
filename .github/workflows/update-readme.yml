name: Auto-Update Profile README

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync 4 Recent Projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import html, json, os, urllib.request

          USERNAME = "Jaysonar07"

          BADGE_MAP = {
              "TypeScript": ("TypeScript", "typescript", "3178C6"),
              "JavaScript": ("JavaScript", "javascript", "F7DF1E"),
              "Python": ("Python", "python", "3776AB"),
              "HTML": ("HTML5", "html5", "E34F26"),
              "CSS": ("CSS3", "css3", "1572B6"),
              "Solidity": ("Solidity", "solidity", "F59E0B"),
              "PHP": ("PHP", "php", "777BB4"),
              "Shell": ("Bash", "gnubash", "4EAA25"),
              "C++": ("C%2B%2B", "cplusplus", "00599C"),
              "Java": ("Java", "openjdk", "ED8B00"),
          }

          req = urllib.request.Request(
              f"https://api.github.com/users/{USERNAME}/repos?sort=pushed&per_page=15&type=owner",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          repos = [
              r for r in json.loads(urllib.request.urlopen(req).read())
              if r["name"].lower() != USERNAME.lower() and not r["fork"]
          ][:4]

          def project_cell(repo):
              name = html.escape(repo["name"])
              url = html.escape(repo["html_url"])
              desc = html.escape(repo["description"] or "Active repository built and maintained on GitHub.")
              lang = repo["language"] or "TypeScript"
              label, logo, color = BADGE_MAP.get(lang, (lang.replace(" ", "_"), "github", "F59E0B"))
              badge = f'<img src="https://img.shields.io/badge/{label}-0d1117?style=flat-square&logo={logo}&logoColor={color}" alt="{html.escape(lang)}" />'
              return (
                  f'    <td width="50%" valign="top">\n'
                  f'      <h3><a href="{url}">📁 {name}</a></h3>\n'
                  f'      <p>{desc}</p>\n'
                  f'      <p>{badge}</p>\n'
                  f'    </td>'
              )

          rows = []
          for i in range(0, len(repos), 2):
              cells = "\n".join(project_cell(r) for r in repos[i:i + 2])
              rows.append(f"  <tr>\n{cells}\n  </tr>")
          projects_block = '\n<table width="100%">\n' + "\n".join(rows) + "\n</table>\n"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          s = readme.index("<!-- RECENT-PROJECTS-START -->") + len("<!-- RECENT-PROJECTS-START -->")
          e = readme.index("<!-- RECENT-PROJECTS-END -->")
          readme = readme[:s] + projects_block + readme[e:]

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          EOF

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync 4 recent projects" && git push)
